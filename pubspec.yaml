name: fexpo
description: FileExpo — a free, ad-free Material You file explorer.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  # Material You wallpaper-based theming (Android 12+), with a graceful
  # fallback to the brand purple/black palette everywhere else.
  dynamic_color: ^1.7.0
  # Runtime permission requests (media / manage-external-storage).
  permission_handler: ^11.3.0
  # File-size + count formatting helpers, and intl for date formatting.
  intl: ^0.19.0
  # ZIP compress/extract for the "Compress…" / "Open as archive" context
  # menu actions (pure Dart, no native/platform code required).
  archive: ^4.0.0
  # System share sheet, used by the "Share" context menu action.
  share_plus: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
