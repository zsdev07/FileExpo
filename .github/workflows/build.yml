name: Build APK (arm64)

# Lets you build FileExpo entirely on GitHub — no local machine needed:
#   - Every push to main / every PR builds an APK you can download from
#     the run's "Artifacts" section (Actions tab -> pick the run).
#   - Pushing a tag like `v0.1.0` additionally attaches the APK to a
#     GitHub Release, so you get a permanent download link + notes.
#   - You can also trigger it manually any time from the Actions tab
#     ("Run workflow" button) — works fine from the GitHub mobile app too.
on:
  workflow_dispatch:

permissions:
  contents: write # only used to attach the APK to a Release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build arm64 release APK
        # --split-per-abi + --target-platform android-arm64 together
        # produce exactly one file: app-arm64-v8a-release.apk (no
        # armeabi-v7a/x86_64 builds wasting CI time).
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileExpo-arm64-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
